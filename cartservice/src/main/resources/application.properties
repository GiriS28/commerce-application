spring.application.name=cart-service
server.port=8082

spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/commerce_cart_db
spring.datasource.username=root
spring.datasource.password=root

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

info.app.name=cart-service
info.app.description=E-commerce Cart Service
info.app.version=1.0.0

product-service.url=http://localhost:8081
product-service.connect-timeout-ms=1000
product-service.read-timeout-ms=2000

resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=500ms
resilience4j.retry.instances.productService.exponential-backoff-multiplier=2

# ===============================
# Circuit Breaker - Product Service
# ===============================

resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.productService.sliding-window-size=5
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=2