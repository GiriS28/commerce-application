stages:
  - test
  - docker-test

# -----------------------------------
# 1. Build and test User Service
# -----------------------------------
build-user-service:
  stage: test

  tags:
    - docker

  image: maven:3.9.9-eclipse-temurin-17

  services:
    - name: postgres:17
      alias: postgres

  variables:
    POSTGRES_DB: commerce_db
    POSTGRES_USER: commerce_user
    POSTGRES_PASSWORD: commerce_password

    DB_URL: jdbc:postgresql://postgres:5432/commerce_db
    DB_USERNAME: commerce_user
    DB_PASSWORD: commerce_password

  script:
    - java -version
    - mvn -version
    - cd user-service
    - mvn clean package


# -----------------------------------
# 2. Test Docker access
# -----------------------------------
docker-test:
  stage: docker-test

  tags:
    - docker

  image: docker:27

  script:
    - docker version
    - docker info