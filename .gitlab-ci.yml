stages:
  - test

test-user-service:
  stage: test
  tags:
    - docker

  script:
    - docker run -d --name ci-postgres -e POSTGRES_DB=commerce_db -e POSTGRES_USER=commerce_user -e POSTGRES_PASSWORD=commerce_password -p 5432:5432 postgres:17
    - sleep 10
    - docker exec ci-postgres pg_isready -U commerce_user -d commerce_db
    - docker stop ci-postgres
    - docker rm ci-postgres