spring.application.name=user-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/commerce_db}
spring.datasource.username=${DB_USERNAME:commerce_user}
spring.datasource.password=${DB_PASSWORD:commerce_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#flyway properties to migrate database
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1

spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG
logging.level.com.nisum.userservice=INFO

management.endpoints.web.exposure.include=health,info